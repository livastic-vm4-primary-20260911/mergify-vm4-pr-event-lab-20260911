merge_protections:
  - name: ALWAYS_ALLOW_PRECEDENCE_CONTROL
    if: true
    success_conditions: true

merge_protections_settings:
  auto_merge_conditions:
    - -mergify-configuration-changed

pull_request_rules:
  - name: CLASSIFY_PRECEDENCE_TRUE
    conditions:
      - mergify-configuration-changed
    actions:
      comment:
        message: PRECEDENCE_CONFIG_CHANGED_TRUE

  - name: CLASSIFY_PRECEDENCE_FALSE
    conditions:
      - -mergify-configuration-changed
    actions:
      comment:
        message: PRECEDENCE_CONFIG_CHANGED_FALSE
