name: VM4 Auto Retry Product Gate
on:
  workflow_dispatch:

jobs:
  vm4-auto-retry-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fail first attempt only
        shell: bash
        run: |
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            echo "controlled first-attempt failure"
            exit 1
          fi
          echo "controlled retry success"
