merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: pr-event-security-probe
    queue_conditions: true
    merge_conditions:
      - check-success = vm4-never-merge-pr-event-guard
    checks_timeout: null

pull_request_rules:
  - name: WA_PRODUCT_ON_CONTROL
    conditions:
      - title = VM4_WA_ON_CONTROL
    actions:
      comment:
        message: WA_PRODUCT_ON_ACTIVE

  - name: WA_PRODUCT_OFF_MERGE_PROBE
    conditions:
      - title = VM4_WA_PRODUCT_OFF_TRIGGER
    actions:
      merge:
        method: merge
